name: Scheduled Source Monitoring

on:
  schedule:
    # Runs every 4 hours at minute 17 (~180 runs/month, safely below Cloudflare Pages 500 builds/month)
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: govsource-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate registry and run unit tests
        run: |
          python3 scripts/validate_registry.py
          python3 -m unittest discover -s tests -v

      - name: Run monitoring checks
        run: python3 scripts/monitor.py

      - name: Commit updated monitoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --staged --quiet; then
            echo "No monitoring data changes to commit."
          else
            git commit -m "chore(data): update monitoring observations"
            git push
          fi
